# JVM: VM has ~3.8 GB RAM. Cap Gradle + Kotlin daemons so their combined heap
# fits in RAM instead of swapping (STEP 1 used -Xmx2048m and thrashed swap).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# Build speed
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
