name: release-package

# STEP 10 배포. 수동 실행(workflow_dispatch) 전용.
# 설치 패키지 zip 은 저장소에 커밋하지 않으므로(.gitignore), 이 워크플로가 실행 시점에
# 릴리즈 APK 를 다시 빌드해 nowflix/ 구조로 패키징한 뒤 GitHub 릴리즈 자산으로 올린다.
# 아티팩트(actions/upload-artifact)가 아니라 릴리즈 자산이므로 브라우저 직링크로 받을 수 있다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈 태그"
        required: true
        default: "v1.0.0"
      source:
        description: "zip 출처"
        required: true
        default: branch
        type: choice
        options:
          # install-package 브랜치에 이미 올라간, 병원 키로 서명·검증이 끝난 zip 을 그대로 올린다.
          # 시크릿이 필요 없고 로컬에서 확인한 바이너리와 100% 동일하다. (기본값)
          - branch
          # 릴리즈 APK 를 이 자리에서 다시 빌드해 패키징한다. 서명 키·앱 키 시크릿 7종이 필요하다.
          - rebuild

permissions:
  contents: write

jobs:
  package:
    name: Build + package + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서명 키와 앱 키는 저장소에 없다(gitignore). Actions 시크릿으로만 주입된다.
      # 하나라도 없으면 서명되지 않은/키 없는 APK 가 배포될 수 있으므로 여기서 즉시 중단한다.
      - name: Check required secrets
        if: inputs.source == 'rebuild'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
          YT: ${{ secrets.YOUTUBE_API_KEY }}
          SU: ${{ secrets.SUPABASE_URL }}
          SA: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in KS SP KA KP YT SU SA; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿 누락:$missing"
            echo "Settings > Secrets and variables > Actions 에 아래 7개를 등록하세요:"
            echo "  RELEASE_KEYSTORE_BASE64 (base64 -w0 nowflix-release.jks)"
            echo "  RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            echo "  YOUTUBE_API_KEY / SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Set up JDK 17
        if: inputs.source == 'rebuild'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: inputs.source == 'rebuild'
        uses: android-actions/setup-android@v3

      # local.properties 와 keystore 는 러너 디스크에만 만들어지고 커밋되지 않는다.
      - name: Restore keystore + local.properties
        if: inputs.source == 'rebuild'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
          YT: ${{ secrets.YOUTUBE_API_KEY }}
          SU: ${{ secrets.SUPABASE_URL }}
          SA: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$KS" | base64 -d > nowflix-release.jks
          {
            printf 'YOUTUBE_API_KEY=%s\n' "$YT"
            printf 'SUPABASE_URL=%s\n' "$SU"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SA"
            printf 'RELEASE_STORE_FILE=nowflix-release.jks\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$SP"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KA"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KP"
          } > local.properties

      - name: Build release APK
        if: inputs.source == 'rebuild'
        run: ./gradlew assembleRelease --stacktrace

      # 서명 없이 빌드가 통과하는 구조(build.gradle.kts 의 hasReleaseSigning 폴백)이므로,
      # 실제로 서명된 APK 인지 여기서 확인하고 아니면 배포를 중단한다.
      - name: Verify APK is signed
        if: inputs.source == 'rebuild'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Assemble nowflix/ package tree
        if: inputs.source == 'rebuild'
        run: |
          rm -rf pkg && mkdir -p pkg/nowflix/dist pkg/nowflix/scripts
          cp app/build/outputs/apk/release/app-release.apk pkg/nowflix/dist/nowflix-1.0.0.apk
          cp scripts/install.sh scripts/uninstall.sh pkg/nowflix/scripts/
          chmod +x pkg/nowflix/scripts/*.sh
          cp -r docs pkg/nowflix/docs
          (cd pkg && zip -r -X ../nowflix-install-package.zip nowflix)

      # 업로드 직전 게이트: keystore / local.properties / .env 계열이 zip 에 섞여 들어가지
      # 않았는지, 텍스트 파일에 키 값이 하드코딩되지 않았는지 확인한다. 걸리면 배포 중단.
      # 기본 경로: 브랜치에 보관된 zip 을 그대로 받아온다. 빌드도 시크릿도 필요 없다.
      - name: Fetch zip from install-package branch
        if: inputs.source == 'branch'
        run: |
          git fetch --depth 1 origin install-package
          git show FETCH_HEAD:nowflix-install-package.zip > nowflix-install-package.zip
          ls -l nowflix-install-package.zip

      - name: Secret scan before upload
        run: |
          echo "--- 파일 목록 ---"; unzip -l nowflix-install-package.zip
          if unzip -Z1 nowflix-install-package.zip \
             | grep -Ei '\.jks$|\.keystore$|local\.properties|(^|/)\.env|\.env\.|\.p12$|\.pem$|google-services\.json'; then
            echo "::error::민감 파일이 패키지에 포함됨 — 업로드 중단"; exit 1
          fi
          rm -rf scan && mkdir scan && unzip -q nowflix-install-package.zip -d scan
          if grep -rEln 'eyJ[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|storePassword|keyPassword' \
             scan/nowflix/scripts scan/nowflix/docs; then
            echo "::error::스크립트/문서에 키 값이 하드코딩됨 — 업로드 중단"; exit 1
          fi
          echo "민감 파일 없음 (clean)"
          rm -rf scan

      # 릴리즈 자산으로 업로드. GITHUB_TOKEN 은 자동 제공되므로 별도 토큰이 필요 없다.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' \
            '병원 설치 담당자용 설치 패키지입니다.' \
            '' \
            '아래 `nowflix-install-package.zip` 을 내려받아 압축을 풀면 `nowflix/` 폴더가 생깁니다.' \
            '' \
            '- `dist/nowflix-1.0.0.apk` — 태블릿에 설치할 앱' \
            '- `scripts/install.sh`, `scripts/uninstall.sh` — PC 에서 실행하는 설치/제거 스크립트' \
            '- `docs/설치가이드.md` — 설치 담당자용 순서 문서 (먼저 읽어주세요)' \
            '- `docs/onsite-checklist.md` — 현장 점검 체크리스트' \
            '- `docs/운영가이드.md`, `docs/kiosk-recovery.md`, `docs/인계문서.md`' \
            '' \
            '키스토어·local.properties·.env 파일은 포함되어 있지 않습니다.' > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nowflix-install-package.zip --clobber
          else
            gh release create "$TAG" nowflix-install-package.zip \
              --target "$GITHUB_SHA" \
              --title "NOWFLIX 키오스크 설치 패키지 v1.0.0" \
              --notes-file notes.md
          fi
          rm -f notes.md
          echo "다운로드 URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nowflix-install-package.zip"
