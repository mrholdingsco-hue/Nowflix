name: verify

# STEP 9 visual + behavioural verification. This VM has no KVM, so the emulator jobs run here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Newer pushes cancel in-flight runs of this workflow on the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets in CI. Dummy build config keeps the build valid and lets the app fall back to
  # bundled assets; every UI/data test instead redirects the network to a local MockWebServer.
  DUMMY_LOCAL_PROPERTIES: |
    YOUTUBE_API_KEY=ci-dummy
    SUPABASE_URL=http://localhost
    SUPABASE_ANON_KEY=ci-dummy
  APP_EXTERNAL_DIR: /sdcard/Android/data/kr.prism.nowflix/files

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — pure JVM unit tests.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write dummy local.properties
        run: printf '%s' "$DUMMY_LOCAL_PROPERTIES" > local.properties

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  # ---------------------------------------------------------------------------
  # Job 2 — instrumented tests + screenshots on an emulator.
  # ---------------------------------------------------------------------------
  instrumented-and-screenshots:
    name: Instrumented tests + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write dummy local.properties
        run: printf '%s' "$DUMMY_LOCAL_PROPERTIES" > local.properties

      # Emulator boot on GitHub runners is flaky (~1-in-4 cold boots). Lean config close to the one
      # that did boot (no ram-size/cores overrides — bumping RAM to 4G on a 7G runner OOM-kills the
      # emulator), API 30 (minSdk 29; these screens need no device-owner APIs), and TWO attempts:
      # attempt 2 only runs if attempt 1 produced no PNGs. Both call the same capture script.
      - name: Capture screenshots (attempt 1)
        id: cap1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-capture-screens.sh

      - name: Capture screenshots (attempt 2, only if none yet)
        if: hashFiles('screenshots/*.png') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-capture-screens.sh

      - name: Upload instrumented diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-diag
          path: |
            connected.log
            screenshot-capture.log
            screenshot-dims.txt
            device-screenshots-ls.txt
            device-find.txt
            instrumented-logcat.txt
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Build contact sheet
        if: always()
        continue-on-error: true   # a convenience overview; never fail the job over it
        run: |
          if ls screenshots/*.png >/dev/null 2>&1; then
            # ImageMagick is no longer preinstalled on ubuntu-latest (montage was missing, which
            # silently failed this step and marked the whole job failed even though every test
            # passed and all 7 screenshots were captured). Install it, then build the sheet.
            if ! command -v montage >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
            fi
            montage screenshots/*.png -tile 2x4 -geometry +6+6 -background '#111111' \
              -title 'NOWFLIX Kiosk - STEP 9 screens' -fill white contact-sheet.png \
              && echo "contact-sheet.png built from:" && ls -1 screenshots/*.png \
              || echo "montage unavailable — skipping contact sheet (individual PNGs still uploaded)."
          else
            echo "No screenshots were captured."
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/*.png
            contact-sheet.png
          if-no-files-found: warn

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/

  # ---------------------------------------------------------------------------
  # Job 3 — kiosk device-owner lock verification on an emulator (no accounts).
  # ---------------------------------------------------------------------------
  kiosk-lock:
    name: Kiosk lock (device owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write dummy local.properties
        run: printf '%s' "$DUMMY_LOCAL_PROPERTIES" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The kiosk job previously used API 34 and never booted, so the four lock checks were never
      # run and kiosk-summary was empty. Switch to the exact API 30 google_apis pixel_c config that
      # boots reliably for the screenshot job (all device-owner APIs used here exist since API 21),
      # add the 900s boot timeout, and make two attempts — attempt 2 runs only if attempt 1 left no
      # summary. Both call scripts/ci-kiosk-verify.sh, which writes PASS/FAIL per check.
      - name: Verify kiosk lock + release (attempt 1)
        id: kiosk1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-kiosk-verify.sh

      - name: Verify kiosk lock + release (attempt 2, only if no summary yet)
        if: hashFiles('kiosk-summary.txt') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-kiosk-verify.sh

      - name: Upload kiosk logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-logcat
          path: kiosk-logcat.txt
          if-no-files-found: ignore

      - name: Upload kiosk summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-summary
          path: kiosk-summary.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 4 — publish captured screens to the ci-screenshots branch.
  #
  # This VM has no GitHub token, so it cannot download run artifacts. Instead we
  # push the PNGs to a dedicated branch that anyone (incl. scripts/refresh-
  # screenshots.sh) can `git fetch`. Single writer → no race; orphan branch,
  # force-pushed each run → screenshots only, no history buildup, main stays image-free.
  # ---------------------------------------------------------------------------
  publish-screenshots:
    name: Publish screenshots to ci-screenshots branch
    runs-on: ubuntu-latest
    needs: [instrumented-and-screenshots, kiosk-lock]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: dl/screenshots
        continue-on-error: true

      - name: Download kiosk summary artifact
        uses: actions/download-artifact@v4
        with:
          name: kiosk-summary
          path: dl/kiosk
        continue-on-error: true

      - name: Download instrumented diagnostics
        uses: actions/download-artifact@v4
        with:
          name: instrumented-diag
          path: dl/diag
        continue-on-error: true

      - name: Download kiosk logcat
        uses: actions/download-artifact@v4
        with:
          name: kiosk-logcat
          path: dl/kiosk-log
        continue-on-error: true

      - name: Commit + push screenshots to ci-screenshots branch
        run: |
          set -e
          SRC_SHA="${{ github.sha }}"
          STAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fresh orphan branch: nothing from main is committed, only the assets we add below.
          git checkout --orphan ci-screenshots
          git rm -rf --cached . >/dev/null 2>&1 || true

          mkdir -p screenshots
          # The screenshots artifact carries the numbered screens plus the contact sheet.
          find dl -name '*.png' 2>/dev/null | while read -r f; do
            b="$(basename "$f")"
            if [ "$b" = "contact-sheet.png" ]; then cp "$f" contact-sheet.png; else cp "$f" "screenshots/$b"; fi
          done
          [ -f dl/kiosk/kiosk-summary.txt ] && cp dl/kiosk/kiosk-summary.txt kiosk-summary.txt || true

          PNG_COUNT=$(find screenshots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          printf 'source_commit=%s\ncaptured_at=%s\nscreenshot_count=%s\n' \
            "$SRC_SHA" "$STAMP" "$PNG_COUNT" > meta.txt

          # Always-on diagnostic manifest so a token-less watcher can see the outcome via `git fetch`.
          {
            echo "run_id=${{ github.run_id }}"
            echo "instrumented_result=${{ needs.instrumented-and-screenshots.result }}"
            echo "kiosk_result=${{ needs.kiosk-lock.result }}"
            echo "png_count=$PNG_COUNT"
            echo "--- downloaded artifact tree ---"
            find dl -type f 2>/dev/null | sort || echo "(no artifacts downloaded)"
            echo "--- screenshots staged ---"
            (cd screenshots && ls -1 *.png 2>/dev/null) || echo "(none)"
          } > status.txt

          # Failure diagnostics routed onto the branch (no token to read run logs otherwise).
          {
            echo "############ screenshot dimensions (orientation check) ############"
            cat dl/diag/screenshot-dims.txt 2>/dev/null || echo "(absent)"
            echo; echo "############ device screenshots dir (adb ls) ############"
            cat dl/diag/device-screenshots-ls.txt 2>/dev/null || echo "(absent)"
            echo; echo "############ device-wide PNG search ############"
            cat dl/diag/device-find.txt 2>/dev/null || echo "(not run — screenshots were found)"
            echo; echo "############ screenshot-capture.log (FULL) ############"
            cat dl/diag/screenshot-capture.log 2>/dev/null || echo "(absent — capture run never produced a log)"
            echo; echo "############ androidTest JUnit failures/errors ############"
            if [ -n "$(find dl/diag -name '*.xml' 2>/dev/null)" ]; then
              grep -rhoE '<(failure|error)[^>]*>[^<]*' dl/diag 2>/dev/null | head -n 60 || echo "(none parsed)"
            else
              echo "(no result XMLs)"
            fi
            echo; echo "############ instrumented logcat: crashes (FATAL/AndroidRuntime) ############"
            grep -aE 'FATAL EXCEPTION|AndroidRuntime|Process crashed|E TestRunner|Compose' dl/diag/instrumented-logcat.txt 2>/dev/null | head -n 60 || echo "(none)"
            echo; echo "############ connected.log (tail) ############"
            tail -n 25 dl/diag/connected.log 2>/dev/null || echo "(absent)"
            echo; echo "############ kiosk logcat (tail) ############"
            tail -n 25 dl/kiosk-log/kiosk-logcat.txt 2>/dev/null || echo "(absent)"
          } > diag.txt

          # Raw JUnit XML(s) onto the branch too, for full per-test detail (names may contain spaces).
          mkdir -p results-xml
          find dl/diag -name '*.xml' 2>/dev/null | while read -r x; do
            cp "$x" "results-xml/$(basename "$x" | tr ' ' '_')"
          done

          git add -f meta.txt status.txt diag.txt
          [ -n "$(ls results-xml 2>/dev/null)" ] && git add -f results-xml/* || true
          find screenshots -name '*.png' | head -1 | grep -q . && git add -f screenshots/*.png || true
          [ -f contact-sheet.png ]  && git add -f contact-sheet.png  || true
          [ -f kiosk-summary.txt ]  && git add -f kiosk-summary.txt  || true

          git commit -m "CI screenshots ($PNG_COUNT) for ${SRC_SHA} @ ${STAMP}"
          git push -f origin ci-screenshots
          echo "Pushed ci-screenshots with $PNG_COUNT screenshot(s)."
