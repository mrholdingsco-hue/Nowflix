<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>NOWFLIX 키오스크 — CI 화면 검증</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --line: #232a31;
    --ink: #e8edf2;
    --muted: #8b97a3;
    --accent: #e50914;
    --ok: #35c46b;
    --bad: #ff5964;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
            "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { -webkit-font-smoothing: antialiased; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }

  header {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -16px 20px; padding: 18px 16px 14px;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(11,13,16,0));
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { color: var(--accent); letter-spacing: .04em; font-weight: 800; }
  .brand span { color: var(--muted); font-size: 13px; }
  .meta { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; }
  .meta .k { color: var(--ink); }
  .meta code { color: var(--ink); background: var(--panel); padding: 1px 6px; border-radius: 5px; }

  figure { margin: 0 0 26px; }
  figcaption {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; margin: 0 2px 8px;
  }
  figcaption .num {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
  }
  .shot {
    display: block; width: 100%; height: auto; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); cursor: zoom-in;
  }
  .missing {
    display: flex; align-items: center; justify-content: center;
    min-height: 120px; border: 1px dashed var(--bad); border-radius: 12px;
    color: var(--bad); font-size: 14px; background: rgba(255,89,100,.05);
  }

  .kiosk { margin-top: 34px; padding: 16px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 12px; }
  .kiosk h2 { margin: 0 0 12px; font-size: 15px; }
  .kiosk pre { margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.9;
               white-space: pre-wrap; word-break: break-word; }
  .kiosk .pass { color: var(--ok); }
  .kiosk .fail { color: var(--bad); }
  .kiosk .result { color: var(--ink); font-weight: 700; }

  footer { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }

  /* Tap-to-zoom lightbox */
  #box { position: fixed; inset: 0; z-index: 50; display: none;
         background: rgba(0,0,0,.92); overflow: auto; cursor: zoom-out;
         -webkit-overflow-scrolling: touch; }
  #box.on { display: block; }
  #box img { display: block; margin: auto; max-width: none; min-width: 100%; }
</style>
</head>
<body>
  <header>
    <div class="brand"><b>NOWFLIX</b><span>키오스크 · CI 화면 검증</span></div>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <main id="gallery"></main>

  <section class="kiosk" id="kiosk" hidden>
    <h2>키오스크 잠금 검증 로그</h2>
    <pre id="kiosk-log"></pre>
  </section>

  <footer>탭하면 원본 크기로 확대됩니다 · 다시 탭하면 닫힙니다</footer>

  <div id="box" onclick="this.classList.remove('on')"><img id="box-img" alt="" /></div>

<script>
  // Filename → Korean screen name, in display order.
  const SCREENS = [
    ["01_main_6parts.png",         "메인 화면 · 파트 6개"],
    ["02_main_8parts.png",         "메인 화면 · 파트 8개(가로 스크롤)"],
    ["03_video_list.png",          "영상 목록 · 파트 상세"],
    ["04_player_controls_shown.png", "플레이어 · 컨트롤 표시"],
    ["05_player_controls_hidden.png","플레이어 · 컨트롤 자동 숨김"],
    ["06_pin_pad.png",             "PIN 잠금 해제 패드"],
    ["07_admin.png",               "관리자 설정"],
    ["08_player_fullscreen.png",   "플레이어 · 전체화면 (v1.1.0)"],
  ];

  const box = document.getElementById("box");
  const boxImg = document.getElementById("box-img");
  function zoom(src) { boxImg.src = src; box.classList.add("on"); }

  const gallery = document.getElementById("gallery");
  SCREENS.forEach(([file, name], i) => {
    const fig = document.createElement("figure");
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<span class="num">${String(i + 1).padStart(2, "0")}</span>${name}`;
    fig.appendChild(cap);

    const img = document.createElement("img");
    img.className = "shot";
    img.loading = "lazy";
    img.alt = name;
    img.src = "./screenshots/" + file;
    img.addEventListener("click", () => zoom(img.src));
    img.addEventListener("error", () => {
      const miss = document.createElement("div");
      miss.className = "missing";
      miss.textContent = `${file} — 촬영 실패 또는 누락`;
      img.replaceWith(miss);
    });
    fig.appendChild(img);
    gallery.appendChild(fig);
  });

  // Header metadata from meta.txt (source_commit / captured_at).
  fetch("./meta.txt", { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => {
      const m = Object.fromEntries(t.trim().split(/\n+/).map(l => l.split("=")));
      const sha = (m.source_commit || "").slice(0, 12) || "—";
      const at = m.captured_at || "—";
      document.getElementById("meta").innerHTML =
        `<span class="k">원본 커밋</span> <code>${sha}</code>` +
        `&nbsp;·&nbsp; <span class="k">촬영</span> ${at}`;
    })
    .catch(() => { document.getElementById("meta").textContent = "메타데이터 없음"; });

  // Optional kiosk lock summary.
  fetch("./kiosk-summary.txt", { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => {
      if (!t.trim()) return;
      const html = t.trim().split("\n").map(line => {
        const e = line.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
        if (/^PASS/.test(line)) return `<span class="pass">${e}</span>`;
        if (/^FAIL/.test(line)) return `<span class="fail">${e}</span>`;
        if (/^RESULT/.test(line)) return `<span class="result">${e}</span>`;
        return e;
      }).join("\n");
      document.getElementById("kiosk-log").innerHTML = html;
      document.getElementById("kiosk").hidden = false;
    })
    .catch(() => { /* no summary on this run — leave section hidden */ });
</script>
</body>
</html>
